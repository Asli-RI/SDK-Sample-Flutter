plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.asliri.demo"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.asliri.demo"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // def keyProperties = new Properties()
    // def keyPropertiesFile = rootProject.file("../key.properties")
    // if (keyPropertiesFile.exists()) {
    //     keyProperties.load(new FileInputStream(keyPropertiesFile))
    // }

    signingConfigs {
        release {
            storeFile file("../key.jks")  // Path langsung ke keystore
            storePassword "demopassiveliveness"  // Password untuk keystore
            keyAlias "key_passive_liveness"  // Alias untuk key
            keyPassword "demopassiveliveness"  // Password untuk key
        }
    }

    buildTypes {
        release {
            shrinkResources true
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { 
        viewBinding = true
    }
    dependencies {
        implementation("com.github.Asli-RI:asli-ocr-android:1.2.6@aar") {
           setTransitive(true)
        }
        implementation("com.google.android.material:material:1.12.0")
    }   
}

flutter {
    source = "../.."
}
